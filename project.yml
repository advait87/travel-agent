name: TravelAgent
options:
  bundleIdPrefix: com.advaitandhale
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 47MQ7BPRNW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TravelAgent:
    type: application
    platform: iOS
    scheme:
      testTargets: [TravelAgentTests, TravelAgentUITests]
    sources: [TravelAgent, Shared]
    dependencies:
      - target: TravelAgentWidget
    info:
      path: TravelAgent/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.advaitandhale.travelagent.checkin]
        UIBackgroundModes: [fetch, location]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.advaitandhale.travelagent
            CFBundleURLSchemes: [travelagent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaitandhale.travelagent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Travel Agent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Your travel agent notices when you arrive at or leave a planned stop, so it can adjust your day automatically.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your travel agent uses your location to suggest things to do nearby and keep your day on track.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hold the mic to tell your travel agent what you are doing.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your voice is turned into text so your travel agent can understand your update.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  TravelAgentWidget:
    type: app-extension
    platform: iOS
    sources: [TravelAgentWidget, Shared]
    info:
      path: TravelAgentWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advaitandhale.travelagent.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Travel Agent Widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  TravelAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TravelAgentTests]
    dependencies:
      - target: TravelAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.advaitandhale.travelagent.tests
  TravelAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TravelAgentUITests]
    dependencies:
      - target: TravelAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.advaitandhale.travelagent.uitests
        TEST_TARGET_NAME: TravelAgent
